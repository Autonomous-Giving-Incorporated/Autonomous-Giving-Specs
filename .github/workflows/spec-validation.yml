name: Spec validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Executable canon validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: pip install -r requirements-validation.txt

      - name: Markdown link validation
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --no-progress --include-mail=false README.md '**/*.md'
          fail: true

      - name: Run full specification validation
        run: python validation/validate_all.py --output validation-report.json

      - name: Generate indexes
        run: python validation/generate_indexes.py

      - name: Package release (smoke)
        run: python validation/package_release.py

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-report
          path: |
            validation-report.json
            generated/
            dist/checksums.txt

  inventory:
    name: Canonical inventory counts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Require expected artifact floors
        run: |
          test -f CONSTITUTION.md
          test "$(find specs -name 'SPEC-*.md' | wc -l | tr -d ' ')" -ge 21
          test "$(find adr -name 'ADR-*.md' | wc -l | tr -d ' ')" -ge 11
          test "$(find events -name 'EVENT-*.md' | wc -l | tr -d ' ')" -ge 10
          test "$(find contracts -name 'CONTRACT-*.md' | wc -l | tr -d ' ')" -ge 7
          test "$(find schemas -name '*.json' | wc -l | tr -d ' ')" -ge 8
