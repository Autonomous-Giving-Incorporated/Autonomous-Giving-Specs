name: Validate specifications

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  documentation:
    name: Documentation integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude-mail README.md '**/*.md'
          fail: true

  schemas:
    name: JSON Schema syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse schemas
        run: python -c "import json, pathlib; [json.loads(p.read_text()) for p in pathlib.Path('schemas').glob('*.json')]"

  repository-canon:
    name: Canonical artifact inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require expected artifact counts
        run: |
          test "$(find specs -name 'SPEC-*.md' | wc -l | tr -d ' ')" = 10
          test "$(find adr -name 'ADR-*.md' | wc -l | tr -d ' ')" = 10
          test "$(find events -name 'EVENT-*.md' | wc -l | tr -d ' ')" = 10
          test "$(find contracts -name 'CONTRACT-*.md' | wc -l | tr -d ' ')" = 7
      - name: Detect duplicate glossary terms
        run: |
          duplicates="$(awk -F'|' '/^\|/ && $2 !~ /Term|---/ {gsub(/^[[:space:]]+|[[:space:]]+$/, \"\", $2); print $2}' glossary/README.md | sort | uniq -d)"
          test -z "$duplicates"
